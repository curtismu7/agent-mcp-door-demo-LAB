# Local standalone form (OrbStack):  docker compose up --build -d   ->  http://127.0.0.1:6850
# Pick another host port with HOST_PORT (inside 6850-6879): HOST_PORT=6851 docker compose up --build -d
# The server binds 0.0.0.0 INSIDE the container (MCPDOOR_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. The shared settings file is not mounted: mock mode needs no settings.
name: agent-mcp-door-demo-lab

services:
  agent-mcp-door-demo-lab:
    build: .
    image: agent-mcp-door-demo-lab:local
    ports:
      - "127.0.0.1:${HOST_PORT:-6850}:6850"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "6850"
      MODE: mock
      MCPDOOR_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6850/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
